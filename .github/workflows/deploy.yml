name: Afrikoba CI/CD Deployment

on:
  push:
    branches: [ main, master ] # Activates when you push to main or master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd web-dashboard && npm install

      - name: Build Frontend
        run: npm run build

      - name: Security Scan (npm audit)
        run: npm audit --audit-level=high

      - name: Verify deployment target config
        run: |
          if [ -n "${{ vars.SERVER_PATH }}" ]; then echo "SERVER_PATH is set (length ${#SERVER_PATH})"; else echo "::error::SERVER_PATH repo variable is NOT set - please configure it under Settings > Secrets and variables > Actions > Variables"; exit 1; fi

      - name: Validate SSH private key format
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "::error::SSH_PRIVATE_KEY secret is empty - configure it under Settings > Secrets and variables > Actions"; exit 1; fi
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          if ssh-keygen -y -f /tmp/deploy_key > /dev/null 2>&1; then
            echo "SSH private key parses OK"
          else
            echo "::error::SSH_PRIVATE_KEY is not a valid private key (ssh: no key found). Re-paste the FULL key INCLUDING its line breaks (-----BEGIN ... PRIVATE KEY----- to -----END ... PRIVATE KEY-----), or regenerate a key pair."
            exit 1
          fi

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          command_timeout: 15m
          script: |
            echo "connected as $(whoami) on $(hostname)"
            cd "${{ vars.SERVER_PATH }}" || exit 1
            pwd
            git pull origin main
            npm install
            bash deploy.sh
