name: API Security & Load (k6)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL under test'
        required: true
        default: 'https://afrikoba.com'
      scope:
        description: 'Which suites to run'
        required: true
        type: choice
        options:
          - security-only
          - load-and-security
        default: security-only

# k6 suites (scripts/load-test.js, scripts/security-test.js) implement the
# NFR-2 / Test-Strategy gate. Default scope is security-only against
# PRODUCTION: the suite is read-only there — malformed payloads are rejected by
# the zod schemas (400, no SMS), unauth probes get 401/403, and the rate-limit
# scenario is skipped when PROD_TARGET=true so it never spams real numbers.
#
# The LOAD suite is opt-in (scope: load-and-security) and is intended for a
# STAGING environment: it performs real OTP registrations, idempotency-keyed
# real transfers between seeded users (255713100001 / 255714100002, db/seed.sql)
# and moves ledger balances. Do not run it against production unless you own the
# money-movement and SMS consequences. Target requirements for load:
#   - RATE_LIMIT_DISABLED=true (or raised OTP_RATE_MAX / OTP cooldown)
#   - FRAUD_VELOCITY_HOUR / FRAUD_VELOCITY_DAY raised (e.g. 100000) so the
#     sustained transfer scenario does not trip the account velocity gate
#     (src/services/fraudDetectionService.js defaults: 10/hour, 50/day).
permissions:
  contents: read

jobs:
  security:
    name: Security suite (SQLi / XSS / auth / CORS / validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Security test
        uses: grafana/k6-action@v0.3.1
        with:
          script: scripts/security-test.js
          flags: >-
            -e BASE_URL=${{ inputs.base_url }}
            -e PROD_TARGET=${{ contains(inputs.base_url, 'afrikoba.com') && !contains(inputs.base_url, 'staging') }}

      - name: Summarize
        run: echo "Security suite completed against ${{ inputs.base_url }} (gate: checks rate==1)"

  load:
    name: Load suite (health / auth / transfer / browsing)
    if: ${{ inputs.scope == 'load-and-security' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load test
        uses: grafana/k6-action@v0.3.1
        with:
          script: scripts/load-test.js
          flags: >-
            -e BASE_URL=${{ inputs.base_url }}

      - name: Summarize
        run: echo "Load suite completed against ${{ inputs.base_url }} (thresholds: P95<2s, failed<15%, logins>5, transfers>3)"