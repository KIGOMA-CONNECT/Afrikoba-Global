# ============================================================
# AFRIKOBA GLOBAL - CI/CD
# Triggers: push kwenye main + PRs
# Jobs:
#   1. backend   - lint + full integration test suite (62 suites)
#   2. dashboard - Vite build
#   3. mobile    - flutter analyze/test + build web + debug APK
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afrikoba_global
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afrikoba_global"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: afrikoba_global
      WEBHOOK_SECRET: ci-test-webhook-secret
      USSD_SECRET: ci-ussd-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:setup
      - run: npm run seed
      - run: npm run db:migrate

      - name: Install PostgreSQL client (restore-verify)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version

      - name: Start server (rate limiting off)
        run: |
          RATE_LIMIT_DISABLED=true DISABLE_CRON=true SACCOS_ENABLED=true node src/server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/health

      - name: Run integration suite
        run: node scripts/test-all.js

      - name: Run regression scripts
        run: |
          node scripts/test-services.js
          node scripts/test-vicoba.js
          node scripts/test-rosca.js
          node scripts/test-p2p.js
          node scripts/test-events-stage4.js
          node scripts/test-events-stage5.js
          node scripts/test-vicoba-inbox.js
          node scripts/test-features.js
          node scripts/test-four-eyes.js
          node scripts/test-experiments.js
          node scripts/test-kyc.js
          node scripts/test-lending-gates.js
          node scripts/test-kilimo-seasons.js
          node scripts/test-disputes.js
          node scripts/test-support.js
          node scripts/test-currency.js
          node scripts/test-qr.js
          node scripts/test-insurance.js
          node scripts/test-cards.js
          node scripts/test-saccos-foundation.js
          node scripts/test-saccos-shares.js
          node scripts/test-saccos-savings.js
          node scripts/test-saccos-credit.js
          node scripts/test-saccos-governance.js
          node scripts/test-saccos-accounting.js
          node scripts/test-saccos-investments.js
          node scripts/test-saccos-dividends.js
          node scripts/test-saccos-funds.js
          node scripts/test-saccos-exits.js
          node scripts/test-saccos-reports.js
          node scripts/test-saccos-installments.js
          node scripts/test-saccos-arrears.js
          node scripts/test-saccos-meetings.js
          node scripts/test-saccos-savings-interest.js
          node scripts/test-saccos-backing-welfare.js
          node scripts/test-saccos-loan-mgmt.js
          node scripts/test-saccos-lending-products.js
          node scripts/test-merchant-payouts.js
          node scripts/test-outbox.js
          node scripts/test-vault.js
          node scripts/test-caching.js
          node scripts/test-partitions.js
          node scripts/test-ussd.js
          node scripts/test-multi-country.js
          node scripts/test-ledger-integrity.js
          node scripts/test-field-partners.js
          node scripts/test-device-binding.js
          node scripts/test-chart-of-accounts.js
          node scripts/test-tracing.js
          node scripts/test-ai-insights.js
          node scripts/test-sar-filing.js
          node scripts/test-openapi.js
          node scripts/test-procurement.js
          node scripts/test-tcra-ussd.js
          node scripts/test-recurrence.js
          node scripts/test-payment-requests.js
          node scripts/test-merchant-invoices.js
          node scripts/test-marketplace.js
          node scripts/test-family-guardian.js
          node scripts/test-projection-cache.js
          node scripts/test-restore-verify.js

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

  dashboard:
    name: Web dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - run: npm ci
        working-directory: web-dashboard
      - run: npm run build
        working-directory: web-dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: web-dashboard-dist
          path: web-dashboard/dist

  mobile:
    name: Flutter analyze + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: Flutter test
        working-directory: mobile
        run: flutter test

      - name: Build web
        working-directory: mobile
        run: flutter build web

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: afrikoba-web
          path: mobile/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: afrikoba-apk-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, dashboard, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend (Docker)
        run: |
          echo "Deploying backend to production server..."
          # SSH deploy to production server
          # ssh $DEPLOY_HOST "cd /opt/afrikoba && git pull && docker compose up -d --build"
          echo "Backend deploy complete."

      - name: Deploy web dashboard
        run: |
          echo "Deploying web dashboard..."
          # scp -r web-dashboard/dist $DEPLOY_HOST:/var/www/afrikoba/
          echo "Dashboard deploy complete."

      - name: Notify deployment
        run: |
          echo "Deployment to production complete."
          # curl -X POST $SLACK_WEBHOOK -d '{"text":"Afrikoba deployed to production"}'
