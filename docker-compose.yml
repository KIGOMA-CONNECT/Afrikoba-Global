# ============================================================
# AFRIKOBA GLOBAL - Docker Compose (Production stack)
# - PostgreSQL 16 (managed volume + backups)
# - API + web dashboard
#
# ISOLATION: this stack always creates its OWN project network,
# volumes and container names (prefix = project name). It never
# touches other Docker projects or hosts running on this server.
# Set COMPOSE_PROJECT_NAME if you need a second Afrikoba stack
# (staging/test) next to the production one.
#
# Matumizi:
#   cp .env.example .env   (kisha jaza maadili halisi)
#   docker compose up -d --build
# ============================================================

name: ${COMPOSE_PROJECT_NAME:-afrikoba}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - afrikoba

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    user: postgres
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: ${DB_USER:-afrikoba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-afrikoba_global}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Schema + seed huletwa kwenye uanzishaji wa kwanza (fresh DB pekee)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # Backup ya kila usiku (host directory - badilisha PATH kwenye .env)
      - ${BACKUP_DIR:-./backups}:/backups
      # Hardened hba_file: peer kwa socket, scram-sha-256 kwa TCP
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETGID
      - SETUID
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-afrikoba} -d ${DB_NAME:-afrikoba_global}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrikoba

  app:
    build: .
    restart: unless-stopped
    user: afrikoba
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - contract_data:/app/contracts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-afrikoba}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-afrikoba_global}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      ALLOWED_WEBHOOK_IPS: ${ALLOWED_WEBHOOK_IPS}
      BEEM_API_KEY: ${BEEM_API_KEY:?set BEEM_API_KEY in .env}
      BEEM_SECRET_KEY: ${BEEM_SECRET_KEY:?set BEEM_SECRET_KEY in .env}
      BEEM_SENDER_ID: ${BEEM_SENDER_ID:-AFRIKOBA}
      AZAMPAY_APP_NAME: ${AZAMPAY_APP_NAME:?set AZAMPAY_APP_NAME in .env}
      AZAMPAY_CLIENT_ID: ${AZAMPAY_CLIENT_ID:?set AZAMPAY_CLIENT_ID in .env}
      AZAMPAY_CLIENT_SECRET: ${AZAMPAY_CLIENT_SECRET:?set AZAMPAY_CLIENT_SECRET in .env}
      AZAMPAY_ENV: ${AZAMPAY_ENV:-production}
      CONTRACT_DIR: contracts
      CONTRACT_BASE_URL: ${CONTRACT_BASE_URL:-https://app.afrikoba.com/contracts}
      TRUST_PROXY: "true"
    # API inafungwa kwenye 127.0.0.1 TU (localhost) - inapatikana kupitia
    # reverse proxy (Caddy/Nginx) pekee. Hivyo hakuna usumbufu kwa ports au
    # apps nyingine za domains nyingine kwenye server.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health/db"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # DB migrations zinaenda kwenye app startup (runMigrations - idempotent).
    # Weka replicas=1 kwa uanzishaji wa kwanza; unaweza kuitumia scaling baada ya
    # DB kumigrate (API ni stateless).
    deploy:
      replicas: 1
    networks:
      - afrikoba

volumes:
  db_data:
  redis_data:
  contract_data:

networks:
  afrikoba:
    driver: bridge
