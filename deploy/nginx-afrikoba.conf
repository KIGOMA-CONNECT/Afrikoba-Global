# =========================================================
# AFRIKOBA GLOBAL - Nginx vhost (app.afrikoba.com)
# ---------------------------------------------------------
# Hii ni faili MAHUSUSI ya afrikoba pekee. HAITAGUSA vhosts
# za domains nyingine kwenye server (sites-available/enabled
# za domain zingine zinaendelea kufanya kazi).
#
# NJIA SALAMA:
#   sudo cp deploy/nginx-afrikoba.conf /etc/nginx/sites-available/afrikoba
#   sudo ln -s /etc/nginx/sites-available/afrikoba /etc/nginx/sites-enabled/afrikoba
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kumbuka: ikiwa APP_PORT kubadilishwa kwenye .env, badilisha
# "3000" hapa chini kuendana nayo.
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.afrikoba.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.afrikoba.com;

    ssl_certificate     /etc/letsencrypt/live/app.afrikoba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.afrikoba.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}